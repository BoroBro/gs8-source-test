plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gs8.srctest'
    compileSdk 34

    defaultConfig {
        applicationId "com.gs8.srctest"
        minSdk 28
        targetSdk 28
        versionCode 1
        versionName "1.0"
    }

    buildFeatures {
        aidl true
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
